name: Refresh headlines

# The site is served as static files, so there's no server running the
# aggregator. This job plays that role: it runs the same snapshot command
# on a schedule and commits the result, which republishes the site.
on:
  schedule:
    - cron: "*/15 * * * *"   # free runners often start late; expect 15-25 min in practice
  workflow_dispatch:          # gives you a "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: refresh-headlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the feeds
        run: python server.py --snapshot

      - name: Commit the snapshot if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No change in the headlines — nothing to publish."
          else
            git commit -m "chore: refresh headlines"
            git push
          fi
